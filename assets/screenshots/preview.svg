<svg xmlns="http://www.w3.org/2000/svg" width="920" height="640" viewBox="0 0 920 640">
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2ede8"/>
      <stop offset="100%" stop-color="#e8e0d8"/>
    </linearGradient>

    <!-- Welcome screen warm dark gradient (salon photo + overlay) -->
    <linearGradient id="welcomeBg" x1="0.3" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1608"/>
      <stop offset="35%" stop-color="#1a0d05"/>
      <stop offset="100%" stop-color="#080402"/>
    </linearGradient>

    <!-- Warm hair-color highlight ellipse -->
    <radialGradient id="bokeh1" cx="70%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#7a4520" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7a4520" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bokeh2" cx="15%" cy="55%" r="40%">
      <stop offset="0%" stop-color="#5c3015" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5c3015" stop-opacity="0"/>
    </radialGradient>

    <!-- Results header gradient (warm skin/bronze) -->
    <linearGradient id="resultHeader" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#c8956c"/>
      <stop offset="100%" stop-color="#7a4a2a"/>
    </linearGradient>

    <!-- Camera gradient bg -->
    <radialGradient id="camCenter" cx="50%" cy="42%" r="38%">
      <stop offset="0%" stop-color="#3a2a1a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a2a1a" stop-opacity="0"/>
    </radialGradient>

    <!-- Phone shadow -->
    <filter id="phoneShadow" x="-8%" y="-4%" width="120%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Page background -->
  <rect width="920" height="640" fill="url(#pageBg)"/>

  <!-- ═══════════════════════════════════════════════════
       PHONE 1 — WELCOME SCREEN  (x offset: 20)
  ════════════════════════════════════════════════════ -->
  <g transform="translate(20, 28)" filter="url(#phoneShadow)">
    <!-- Phone body -->
    <rect x="0" y="0" width="260" height="565" rx="38" fill="#131313"/>
    <rect x="1" y="1" width="258" height="563" rx="37" fill="none" stroke="#2e2e2e" stroke-width="1"/>
    <!-- Volume buttons left -->
    <rect x="-3.5" y="88" width="5" height="28" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="128" width="5" height="48" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="186" width="5" height="48" rx="2.5" fill="#222"/>
    <!-- Power button right -->
    <rect x="258.5" y="112" width="5" height="68" rx="2.5" fill="#222"/>
    <!-- Screen bezel -->
    <rect x="7" y="11" width="246" height="543" rx="30" fill="#000"/>
    <!-- Dynamic island -->
    <rect x="97" y="18" width="66" height="17" rx="8.5" fill="#131313"/>

    <!-- ── Welcome screen content ── -->
    <clipPath id="c1"><rect x="7" y="11" width="246" height="543" rx="30"/></clipPath>
    <g clip-path="url(#c1)">
      <rect x="7" y="11" width="246" height="543" fill="url(#welcomeBg)"/>
      <!-- Bokeh warmth -->
      <rect x="7" y="11" width="246" height="543" fill="url(#bokeh1)"/>
      <rect x="7" y="11" width="246" height="543" fill="url(#bokeh2)"/>
      <!-- Dark overlay -->
      <rect x="7" y="11" width="246" height="543" fill="#000" fill-opacity="0.38"/>

      <!-- Title block -->
      <text x="32" y="138" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="32" font-weight="800" fill="#fff" letter-spacing="0.5">AI Stylist</text>
      <text x="32" y="160" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="13" fill="#fff" fill-opacity="0.76">Discover your perfect look.</text>

      <!-- Primary button -->
      <rect x="22" y="446" width="216" height="52" rx="26" fill="#ffffff"/>
      <text x="96" y="478" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#000" text-anchor="middle">Find My Style</text>
      <text x="186" y="478" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="16" fill="#000">→</text>

      <!-- Secondary button -->
      <rect x="22" y="508" width="216" height="50" rx="25" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.36" stroke-width="1"/>
      <text x="130" y="539" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">My Saved Looks</text>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════
       PHONE 2 — CAMERA SCREEN  (x offset: 330)
  ════════════════════════════════════════════════════ -->
  <g transform="translate(330, 28)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="260" height="565" rx="38" fill="#131313"/>
    <rect x="1" y="1" width="258" height="563" rx="37" fill="none" stroke="#2e2e2e" stroke-width="1"/>
    <rect x="-3.5" y="88" width="5" height="28" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="128" width="5" height="48" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="186" width="5" height="48" rx="2.5" fill="#222"/>
    <rect x="258.5" y="112" width="5" height="68" rx="2.5" fill="#222"/>
    <rect x="7" y="11" width="246" height="543" rx="30" fill="#000"/>
    <rect x="97" y="18" width="66" height="17" rx="8.5" fill="#131313"/>

    <!-- ── Camera screen content ── -->
    <clipPath id="c2"><rect x="7" y="11" width="246" height="543" rx="30"/></clipPath>
    <g clip-path="url(#c2)">
      <!-- Camera view -->
      <rect x="7" y="11" width="246" height="543" fill="#151515"/>
      <!-- Warm centre (simulates face/skin) -->
      <rect x="7" y="11" width="246" height="543" fill="url(#camCenter)"/>

      <!-- Dashed oval face guide -->
      <ellipse cx="130" cy="215" rx="90" ry="120" fill="none" stroke="#fff" stroke-opacity="0.62" stroke-width="2" stroke-dasharray="8 5"/>
      <!-- Corner tick marks on oval (top, bottom, left, right) -->
      <line x1="130" y1="88" x2="130" y2="82" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="130" y1="342" x2="130" y2="348" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="40" y1="215" x2="34" y2="215" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="220" y1="215" x2="226" y2="215" stroke="#fff" stroke-opacity="0.8" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Guide text -->
      <text x="130" y="364" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#fff" fill-opacity="0.76" text-anchor="middle">Align face here</text>

      <!-- Bottom controls bar -->
      <rect x="7" y="410" width="246" height="144" rx="0" fill="#000" fill-opacity="0.72"/>

      <!-- Gallery icon button -->
      <rect x="32" y="438" width="48" height="48" rx="24" fill="#fff" fill-opacity="0.18"/>
      <rect x="47" y="453" width="8" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
      <rect x="57" y="453" width="8" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
      <rect x="47" y="463" width="8" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>
      <rect x="57" y="463" width="8" height="8" rx="1.5" fill="#fff" fill-opacity="0.85"/>

      <!-- Shutter button -->
      <circle cx="130" cy="462" r="38" fill="none" stroke="#fff" stroke-width="3.5"/>
      <circle cx="130" cy="462" r="30" fill="#fff"/>

      <!-- Flip camera button -->
      <rect x="180" y="438" width="48" height="48" rx="24" fill="#fff" fill-opacity="0.18"/>
      <!-- Simplified refresh/flip arrows -->
      <path d="M203 448 a14 14 0 0 1 0 28" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
      <polyline points="203,448 199,444 207,444" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M203 476 a14 14 0 0 1 0-28" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round"/>
      <polyline points="203,476 207,480 199,480" fill="none" stroke="#fff" stroke-opacity="0.85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════════════
       PHONE 3 — RESULTS SCREEN  (x offset: 640)
  ════════════════════════════════════════════════════ -->
  <g transform="translate(640, 28)" filter="url(#phoneShadow)">
    <rect x="0" y="0" width="260" height="565" rx="38" fill="#131313"/>
    <rect x="1" y="1" width="258" height="563" rx="37" fill="none" stroke="#2e2e2e" stroke-width="1"/>
    <rect x="-3.5" y="88" width="5" height="28" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="128" width="5" height="48" rx="2.5" fill="#222"/>
    <rect x="-3.5" y="186" width="5" height="48" rx="2.5" fill="#222"/>
    <rect x="258.5" y="112" width="5" height="68" rx="2.5" fill="#222"/>
    <rect x="7" y="11" width="246" height="543" rx="30" fill="#000"/>
    <rect x="97" y="18" width="66" height="17" rx="8.5" fill="#131313"/>

    <!-- ── Results screen content ── -->
    <clipPath id="c3"><rect x="7" y="11" width="246" height="543" rx="30"/></clipPath>
    <g clip-path="url(#c3)">
      <!-- White base -->
      <rect x="7" y="11" width="246" height="543" fill="#ffffff"/>

      <!-- Header photo placeholder -->
      <rect x="7" y="11" width="246" height="190" fill="url(#resultHeader)"/>
      <!-- Face silhouette hint -->
      <ellipse cx="130" cy="110" rx="42" ry="52" fill="#000" fill-opacity="0.18"/>
      <rect x="99" y="155" width="62" height="46" rx="4" fill="#000" fill-opacity="0.12"/>

      <!-- White card overlay with rounded top -->
      <rect x="7" y="178" width="246" height="376" rx="20" fill="#ffffff"/>

      <!-- "Your Profile" -->
      <text x="24" y="212" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="20" font-weight="800" fill="#000">Your Profile</text>

      <!-- ── Info card: Face Shape ── -->
      <rect x="17" y="222" width="104" height="72" rx="14" fill="#f8f9fa"/>
      <!-- scan-outline icon (simplified) -->
      <circle cx="44" cy="244" r="10" fill="none" stroke="#444" stroke-width="1.6"/>
      <line x1="44" y1="233.5" x2="44" y2="231" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="44" y1="257" x2="44" y2="254.5" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="33.5" y1="244" x2="31" y2="244" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="57" y1="244" x2="54.5" y2="244" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
      <text x="69" y="247" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="9" fill="#777" text-anchor="middle">Face Shape</text>
      <text x="69" y="264" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">Oval</text>
      <text x="69" y="282" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="9" fill="#999" text-anchor="middle">Hair: Wavy</text>

      <!-- ── Info card: Skin Tone ── -->
      <rect x="129" y="222" width="104" height="72" rx="14" fill="#f8f9fa"/>
      <!-- color-palette icon (dots) -->
      <circle cx="153" cy="238" r="5" fill="#e8a87c"/>
      <circle cx="164" cy="238" r="5" fill="#c0724a"/>
      <circle cx="158" cy="248" r="5" fill="#7a4020"/>
      <text x="180" y="247" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="9" fill="#777" text-anchor="middle">Skin Tone</text>
      <text x="180" y="264" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#111" text-anchor="middle">Medium</text>
      <text x="180" y="282" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="9" fill="#999" text-anchor="middle">Warm</text>

      <!-- "Recommended Styles" -->
      <text x="17" y="316" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="15" font-weight="700" fill="#000">Recommended Styles</text>

      <!-- Suggestion card 1 -->
      <rect x="13" y="325" width="228" height="62" rx="12" fill="#f0f0f0"/>
      <text x="27" y="346" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="13" fill="#e6c026">✦</text>
      <text x="44" y="346" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="700" fill="#111">Layered Lob</text>
      <text x="17" y="362" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="10" fill="#555">Enhances oval faces and adds movement</text>
      <text x="17" y="376" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="10" fill="#555">to wavy texture.</text>

      <!-- Suggestion card 2 -->
      <rect x="13" y="394" width="228" height="62" rx="12" fill="#f0f0f0"/>
      <text x="27" y="415" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="13" fill="#e6c026">✦</text>
      <text x="44" y="415" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="700" fill="#111">Curtain Bangs</text>
      <text x="17" y="431" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="10" fill="#555">Softens forehead, suits warm skin tones</text>
      <text x="17" y="445" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="10" fill="#555">beautifully.</text>

      <!-- Start Over button -->
      <rect x="17" y="465" width="220" height="48" rx="24" fill="#111"/>
      <text x="127" y="495" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Start Over</text>
    </g>
  </g>

  <!-- Screen labels -->
  <text x="150" y="614" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#888" text-anchor="middle">Welcome</text>
  <text x="460" y="614" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#888" text-anchor="middle">Camera</text>
  <text x="770" y="614" font-family="-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif" font-size="12" font-weight="600" fill="#888" text-anchor="middle">Results</text>
</svg>
